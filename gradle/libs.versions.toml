[versions]
# Compile against the upper supported AGP 9.2 line. Both dependencies are
# compileOnly: consumers supply a matrix-tested compatible implementation.
agp = "9.2.1"
agp-floor = "8.5.2"
kotlin = "2.4.10"
junit = "6.1.2"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
android-gradle-api-floor = { module = "com.android.tools.build:gradle-api", version.ref = "agp-floor" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.2" }
